name: Weekly Insurance Report Automation

on:
  schedule:
    # cron 설정: UTC 기준 일요일 21:00 = 한국 시간(KST) 월요일 06:00
    - cron: '0 21 * * 0'
  workflow_dispatch: # Actions 탭에서 버튼 클릭으로 즉시 수동 실행 가능하게 함

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: 코드 불러오기 (Checkout)
        uses: actions/checkout@v3

      - name: 파이썬 환경 설정
        uses: actions/python-version@v4
        with:
          python-version: '3.10'

      - name: 필수 라이브러리 설치
        run: |
          python -m pip install --upgrade pip
          pip install google-generativeai feedparser

      - name: 파이썬 자동화 스크립트 실행
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python auto_report_generator.py

      - name: 변경된 파일 자동 저장 및 Git Push
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action Bot"
          git add .
          git commit -m "auto: 주간 보고서 자동 업데이트" || exit 0
          git push
